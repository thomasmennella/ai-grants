<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Innovations with AI · Grants Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a68'/%3E%3Cpath d='M9 22l7-13 7 13' stroke='%23e0b04a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ef; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1b2331; --ink-2:#3a4456; --muted:#6a7282;
  --line:#e3dfd6; --line-2:#d3cec2;
  --navy:#1f3a68; --navy-2:#2b4f8c; --navy-soft:#e8eef8;
  --gold:#b8861f; --gold-2:#e0b04a; --gold-soft:#f8efd9;
  --ok:#2d7a4b; --ok-soft:#e2f2e8; --warn:#9a5d00; --warn-soft:#fcefd6; --bad:#b0271f; --bad-soft:#fae4e2;
  --draft:#5b54b8; --draft-soft:#eceafb;
  --radius:10px; --shadow:0 1px 2px rgba(27,35,49,.06),0 4px 16px rgba(27,35,49,.06);
  --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--navy-2)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15} h2{font-size:22px} h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0;overflow:hidden}
.brand-name{overflow:hidden;text-overflow:ellipsis}
.brand-mark{width:28px;height:28px;border-radius:7px;background:#fff1;display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap}
.brand-sub{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px}
.userchip .who{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.demo-flag{background:var(--gold-2);color:#2a1d00;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;text-transform:uppercase}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:#bdb7a9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold-2);border-color:var(--gold-2);color:#2a1d00}
.btn.danger{color:var(--bad);border-color:#e7b9b5}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#0000000a}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.topbar .btn{background:#ffffff14;border-color:#ffffff30;color:#fff}
.topbar .btn:hover{background:#ffffff26}
.linkbtn{background:none;border:0;padding:0;color:var(--navy-2);cursor:pointer;text-decoration:underline;font-size:inherit}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:20px 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--gold)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--navy);border-bottom-color:var(--gold-2)}
.tab .count{font-size:11px;background:var(--navy-soft);color:var(--navy);border-radius:99px;padding:1px 7px;margin-left:6px}

/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:8px 10px;outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px #2b4f8c22}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
.input.sm{padding:5px 8px;font-size:13px;border-radius:6px}
select.input.sm{min-width:96px;padding-right:22px}
select.input.sm[data-dec]{min-width:170px}
select.input.sm[data-pr=role]{min-width:124px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--navy)}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfc9bc;border-radius:99px;transition:.15s;cursor:pointer}
.switch span:before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px #0003}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:disabled+span{opacity:.5;cursor:not-allowed}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-draft{background:var(--draft-soft);color:var(--draft)} .b-navy{background:var(--navy-soft);color:var(--navy)} .b-gold{background:var(--gold-soft);color:#7a5608}
.b-plain{background:#efece5;color:var(--muted)}
.tier{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tier.micro{background:#e6f0ee;color:#1f6356} .tier.midi{background:#f4e6f1;color:#7c2f6c}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-bottom:1px solid #eeebe4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fbfaf6}
.tbl td.c,.tbl th.c{text-align:center} .tbl td.r,.tbl th.r{text-align:right}
.tbl .mean-col{background:var(--gold-soft)!important}
.tbl th.mean-col{color:#7a5608}
.meanpill{display:inline-block;min-width:52px;text-align:center;font-weight:700;font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--gold-2);border-radius:7px;padding:2px 8px}
.cell-sub{font-weight:600}
.cell-draft{color:var(--draft);font-style:italic}
.cell-coi{font-size:11px;font-weight:700;color:var(--muted);background:#efece5;border-radius:4px;padding:1px 5px}
.cell-none{color:#c0baad}
.unit-l{font-size:11px;text-transform:none;letter-spacing:0;font-weight:500;max-width:96px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot{background:var(--warn-soft)!important}
tr.below td{color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.hl{border-color:var(--gold-2);background:linear-gradient(180deg,#fffaf0,#fff)}
.bar{height:6px;background:#ece8df;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* landing */
.hero{text-align:center;padding:56px 20px 30px}
.hero h1{font-size:40px}
.hero p{color:var(--muted);margin:10px 0 0;font-size:15.5px}
.portal-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:880px;margin:18px auto 0}
.pcard{padding:26px 26px 24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.pcard:before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--navy)}
.pcard.mg:before{background:var(--gold-2)}
.pcard .ico{width:44px;height:44px;border-radius:10px;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy)}
.pcard.mg .ico{background:var(--gold-soft);color:#7a5608}
.pcard p{margin:0;color:var(--muted);font-size:13.5px}
.pcard form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px}

/* scoring view */
.score-shell{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,1fr);grid-template-rows:minmax(0,1fr);height:calc(100vh - 56px);height:calc(100dvh - 56px);overflow:hidden}
.pdf-pane{background:#525659;display:flex;flex-direction:column;min-width:0;min-height:0}
.pdf-pane .pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#3b3f42;color:#e8e8e8;font-size:12.5px}
.pdf-pane .pbar a{color:#fff}
.pdf-pane iframe{flex:1;border:0;width:100%;background:#525659}
.pdf-empty{flex:1;display:grid;place-items:center;color:#ddd;padding:30px;text-align:center}
.rub-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);border-left:1px solid var(--line)}
.rub-head{padding:14px 18px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.rub-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 24px}
.rub-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.total-big{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1}
.total-big small{font-size:14px;color:var(--muted);font-weight:500}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:12px}
.crit.done{border-color:#cfe3d6}
.crit.needs{border-color:#f0c27a;box-shadow:0 0 0 3px #f0c27a33}
.crit-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.crit-h h3{font-size:15px;line-height:1.3}
.crit-meta{display:flex;gap:6px;flex:none;align-items:center}
.sec{font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;white-space:nowrap}
.wt{font-size:11px;font-weight:700;color:var(--navy);background:var(--navy-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.guid{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--gold-2);padding:6px 10px;margin:9px 0 2px;border-radius:0 6px 6px 0}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lvl{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:100%;transition:border-color .1s,background .1s}
.lvl:hover:not(:disabled){border-color:var(--navy-2);background:#f7f9fd}
.lvl .lv-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.lvl .lv-n{font-weight:700;font-size:16px;font-family:var(--serif)}
.lvl .lv-l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:right}
.lvl .lv-d{font-size:11.5px;line-height:1.35;color:var(--ink-2)}
.lvl.on{border-color:var(--navy);background:var(--navy);color:#fff}
.lvl.on .lv-l,.lvl.on .lv-d{color:#dfe6f3}
.lvl:disabled{cursor:default}
.lvl.on.zero{background:var(--bad);border-color:var(--bad)}
.crit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.cmt{margin-top:8px}
.bonus-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #eeebe4}
.bonus-row:first-of-type{border-top:0}
.pts{font-weight:700;color:#7a5608;background:var(--gold-soft);border-radius:6px;padding:1px 8px;font-size:12.5px;white-space:nowrap}
.coi-box{border:1px dashed var(--line-2);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;background:var(--surface-2);font-size:13px}
.lockbar{background:var(--ok-soft);color:var(--ok);border:1px solid #c5e2cf;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.lockbar.recused{background:#efece5;color:var(--ink-2);border-color:var(--line-2)}
.lockbar.closed{background:var(--warn-soft);color:var(--warn);border-color:#f0d29a}
.savestate{font-size:12px;color:var(--muted)}
.tierline{font-size:12.5px;padding:6px 10px;border-radius:7px;background:var(--navy-soft);color:var(--navy);margin-top:8px}

/* upload */
.drop{border:2px dashed var(--line-2);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);background:var(--surface-2);cursor:pointer;transition:.15s}
.drop.over{border-color:var(--navy-2);background:var(--navy-soft);color:var(--navy)}
.staged td{background:#fffcf3}

/* toasts & modal */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px #0003;max-width:380px;animation:tin .18s ease-out}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:#1b233166;display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px #0004;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal .mh{padding:18px 20px 0} .modal .mb{padding:12px 20px} .modal .mf{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.codebox{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}

.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cmt-block{border-top:1px solid #eeebe4;padding:12px 0}
.cmt-block:first-child{border-top:0;padding-top:0}
.cmt-block .who{font-weight:600}
.cmt-block ul{margin:6px 0 0;padding-left:18px}
.cmt-block li{margin:3px 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.notice{background:var(--gold-soft);border:1px solid #efd9a6;border-radius:var(--radius);padding:12px 16px;font-size:13.5px;color:#5c4206}
.notice.info{background:var(--navy-soft);border-color:#cdd9ee;color:var(--navy)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{padding:18px;opacity:.9}
.mod h3{font-size:15.5px;margin-bottom:6px}
.mod p{margin:0;font-size:13px;color:var(--muted)}
details.rb{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px}
details.rb summary{padding:10px 12px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
details.rb .rb-body{padding:4px 12px 12px;display:grid;gap:8px}

@media (max-width: 980px){
  .score-shell{grid-template-columns:1fr;grid-template-rows:auto;height:auto;overflow:visible}
  .rub-body{overflow:visible}
  .pdf-pane{height:70vh}
  .rub-pane{border-left:0}
  .rub-foot{position:sticky;bottom:0}
  .detail-grid{grid-template-columns:1fr}
}
@media (max-width: 720px){
  .wrap{padding:20px 16px 48px}
  .portal-cards,.grid2{grid-template-columns:1fr}
  .hero{padding:36px 8px 16px} .hero h1{font-size:30px}
  .levels{grid-template-columns:1fr}
  .lvl{flex-direction:row;align-items:flex-start;gap:10px}
  .lvl .lv-top{flex-direction:column;align-items:flex-start;min-width:74px}
  .lvl .lv-l{text-align:left}
  .brand-sub,.userchip .who{display:none}
  .pdf-pane{height:auto}
  .pdf-pane iframe,.pdf-pane .pdf-empty{display:none}
  .pdf-pane .pbar{padding:12px 16px;font-size:14px}
  .pdf-pane .pbar a{background:#fff;color:var(--navy);padding:6px 12px;border-radius:7px;text-decoration:none;font-weight:600}
  .topbar{padding:0 12px;gap:10px}
}
@media print{
  .topbar,.tabs,.noprint,#toasts{display:none!important}
  body{background:#fff;font-size:11px}
  .wrap{max-width:none;padding:0}
  .card,.tbl-wrap,.kpi{box-shadow:none}
  .tbl th{position:static}
  .printonly{display:block!important}
}
.printonly{display:none}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="app"></main>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="rubric.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
